name: MeetingIntro
options:
  bundleIdPrefix: com.oluyinka
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  MeetingIntro:
    type: application
    platform: macOS
    sources:
      - path: MeetingIntro
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: MeetingIntro/Info.plist
      properties:
        LSUIElement: true
        NSCalendarsFullAccessUsageDescription: "MeetingIntro needs access to your calendars to monitor upcoming meetings and trigger countdown reminders."
        NSCalendarsUsageDescription: "MeetingIntro needs access to your calendars to monitor upcoming meetings and trigger countdown reminders."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oluyinka.MeetingIntro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: false
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "$(MEETINGINTRO_SIGN_IDENTITY:default=-)"
          DEVELOPMENT_TEAM: "$(MEETINGINTRO_TEAM_ID:default=)"
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
